name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify installed wheel and backend registration
        run: |
          python -m venv "$RUNNER_TEMP/torque-wheel"
          "$RUNNER_TEMP/torque-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/torque-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/torque-wheel/bin/python" -c 'from importlib.metadata import entry_points; backend = next(ep for ep in entry_points(group="gwf.backends") if ep.name == "torque"); assert backend.load().__name__ == "TorqueBackend"'
          "$RUNNER_TEMP/torque-wheel/bin/python" -m unittest discover -s tests -v
